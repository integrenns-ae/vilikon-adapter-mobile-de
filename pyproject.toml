[project]
name = "vilikon-adapter-mobile-de"
version = "0.2.0"
description = "MCP server and Vilikon tool for one car dealer's own mobile.de account (Seller API and Lead API)"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.28,<1",
    "mcp>=2.3,<3",
    "pillow>=11",
    "pillow-heif>=0.20",
    "starlette>=1.0,<2",
    "uvicorn>=0.30,<1",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.24", "ruff>=0.6"]

[project.scripts]
mobilede-adapter = "mobilede_adapter.__main__:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
